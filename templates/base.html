<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}个人主页{% endblock %} - {{ profile.name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="{{ url_for('index') }}" class="nav-logo">{{ profile.name }}</a>
            <ul class="nav-links">
                <li><a href="{{ url_for('index') }}">首页</a></li>
                <li><a href="{{ url_for('code_counter_page') }}">代码统计</a></li>
                <li><a href="{{ url_for('math_quiz_page') }}">数学题生成</a></li>
                <li><a href="{{ profile.github }}" target="_blank" rel="noopener">GitHub ↗</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>© 2026 {{ profile.name }} · 用 Flask + Python 构建 ·
            <a href="{{ profile.github }}" target="_blank" rel="noopener">GitHub</a>
        </p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
